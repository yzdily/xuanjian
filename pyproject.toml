[project]
name = "xuanjian"
version = "0.1.0"
description = "玄鉴 XuanJian — 智能化安全漏洞扫描器，AI驱动 + 本地规则双引擎"
requires-python = ">=3.10"
dependencies = [
    # LLM
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    # MCP
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "fastmcp>=0.5.0",
    # 浏览器
    "playwright>=1.40.0",
    # 代理抓包
    "mitmproxy>=10.0.0",
    # Web 服务
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    # OCR / 验证码辅助
    "ddddocr>=1.0.5",
    "rapidocr-onnxruntime>=1.3.0",
    # 基础
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "diff-cover>=8.0.0",
    "ruff>=0.5.0",
]
report-templates = [
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
]

[project.scripts]
add-skill = "scripts.add_skill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "web", "mcp_servers", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

# ============================================================
# 测试配置（pytest）
# pythonpath="." 保证 tests/ 内能直接 import core / web / mcp_servers
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# asyncio_mode="auto" 让所有 async def test_* 自动套事件循环，
# 无需逐个加 @pytest.mark.asyncio（且 --strict-markers 下 asyncio 标记由插件自动注册）。
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=core",
    "--cov=web",
    "--cov=mcp_servers",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]
markers = [
    "slow: 标记为耗时测试（如真实浏览器/真实 LLM 调用），默认不跑",
    "integration: 集成测试，涉及本地 HTTP/文件 I/O",
    "e2e: 端到端测试，需要真实目标或浏览器",
    "llm: 需要真实 LLM Provider 的测试",
    "regression: 回归 pin 测试，锁定已修缺陷防止退化",
    "golden: 怪物方法 golden 录制→回放闸门；样本缺失或运行时不可用时自动 skip",
]

[tool.coverage.run]
branch = true
source = ["core", "web", "mcp_servers"]
omit = [
    "*/tests/*",
    "core/burp/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# ★ 分层门禁 Layer 1: 全局 ratchet（8→20→40→70）
# 阈值存储在 .coverage-ratchet 文件中，只升不降
# CI 通过 scripts/ci_gate.py 读取并执行；本地默认使用此值
fail_under = 20

[tool.coverage.html]
directory = "htmlcov"
