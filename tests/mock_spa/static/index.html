<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock SPA Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; }
        .navbar { background: #001529; color: #fff; padding: 0 24px; height: 48px; display: flex; align-items: center; }
        .navbar h1 { font-size: 18px; font-weight: 500; }
        .container { display: flex; min-height: calc(100vh - 48px); }
        .sidebar { width: 200px; background: #001529; color: #aaa; }
        .sidebar a { display: block; padding: 12px 24px; color: #aaa; text-decoration: none; cursor: pointer; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: #1890ff; }
        .content { flex: 1; padding: 24px; }
        .login-form { max-width: 300px; margin: 80px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .login-form input { width: 100%; padding: 8px 12px; margin-bottom: 16px; border: 1px solid #d9d9d9; border-radius: 4px; }
        .login-form button { width: 100%; padding: 8px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .card { background: #fff; padding: 24px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #e6f7ff; color: #1890ff; }
    </style>
</head>
<body>
    <!-- Vue 3 挂载点 -->
    <div id="app">
        <div class="navbar">
            <h1>Mock SPA Admin</h1>
        </div>
        <div class="container" id="main-content">
            <!-- 内容由 JS 动态渲染 -->
        </div>
    </div>

    <!-- 模拟 Vue 3 实例（简化版，不需要真正的 Vue 运行时） -->
    <script>
        // 模拟 Vue 3 app 实例挂载标记，供 spa_mixin._detect_spa_enhanced() 检测
        document.querySelector('#app').__vue_app__ = {
            config: {
                globalProperties: {
                    $router: {
                        getRoutes: function() {
                            return [
                                { path: '/dashboard' },
                                { path: '/users' },
                                { path: '/users/detail' },
                                { path: '/system/config' },
                                { path: '/export/data' },
                                { path: '/login' },
                            ];
                        },
                        options: { history: 'history' }
                    }
                }
            }
        };
    </script>

    <!-- 引入各 JS 模块 -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/realtime.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
