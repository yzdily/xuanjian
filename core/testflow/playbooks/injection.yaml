# injection 域 playbook — 第一批（v3 §五）
# 判定铁律：SQLException/java.sql/jdbc/Bad SQL grammar 才记 sqli；
# NumberFormatException/TypeMismatch/ParseException → info_leak ≤ medium
domain: injection
steps:
  - id: injection_tamper_matrix
    executor: tool
    tool: injection
    description: 篡改矩阵（引号/注释/布尔盲注变体）
  - id: error_based_sqli
    executor: local
    rules: [sqli_error_based]
    description: 报错注入（五铁律判定：SQL 异常签名才坐实）
  - id: time_based_blind
    executor: llm
    description: 时间盲注（未覆盖字段须写入部分覆盖声明）
    skill: sqli-sql-injection
  - id: xxe_ssti_jndi
    executor: llm
    description: XXE/SSTI/JNDI 按归属参数触发
    skill: ssti-server-side-template-injection
  - id: error_type_reclassify
    executor: local
    rules: [error_type_info_leak]
    description: NumberFormatException/TypeMismatch → info_leak ≤ medium（不记 sqli）
termination:
  - depth >= 2
  - rce_confirmed
  - no_new_findings_in_layer
verdict_ref: run_triage_gate
