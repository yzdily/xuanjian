# 链模板 10/12（§6）：竞态 → 限额/优惠券绕过 → 业务逻辑
chain: race_logic_bypass
name: "竞态 → 限额/优惠券绕过 → 业务逻辑"
severity_baseline: medium
hops:
  - id: race_entry
    role: entry
    match: { domains: [business], vuln_types: [race_conditions], verdicts: [confirmed, open_proof_gap] }
    produces: [state_change_bypass]
  - id: logic_bypass
    role: sink
    match: { domains: [business], vuln_types: [logic], verdicts: [confirmed, open_proof_gap] }
    consumes: [state_change_bypass]
    produces: [logic_bypassed]
min_hops: 2
