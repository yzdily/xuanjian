# 弱口令检测规则
- name: 默认凭据检测
  type: weak_password
  severity: high
  description: 尝试使用常见默认凭据登录
  credentials:
    - [admin, admin]
    - [admin, 123456]
    - [admin, admin123]
    - [admin, password]
    - [admin, admin@123]
    - [admin, P@ssw0rd]
    - [admin, Passw0rd]
    - [root, root]
    - [root, 123456]
    - [root, password]
    - [test, test]
    - [test, 123456]
    - [guest, guest]
    - [user, user]
    - [administrator, administrator]
    - [sa, sa]
    - [sa, 123456]
    - [postgres, postgres]
    - [postgres, 123456]
    - [oracle, oracle]
  login_indicators:
    url_patterns:
      - login
      - signin
      - auth
      - 登录
      - api/auth
    success_signals:
      - token
      - access_token
      - session
      - login success
      - 登录成功
      - '"code":0'
      - '"code": 0'
      - '"success":true'
    failure_signals:
      - error
      - fail
      - invalid
      - wrong
      - incorrect
      - 失败
      - 错误
      - 密码不正确
  content_types:
    - application/json
    - application/x-www-form-urlencoded
  fix: 强制密码复杂度策略，禁用默认凭据

- name: 空口令检测
  type: weak_password
  severity: medium
  description: 检测是否允许空密码登录
  credentials:
    - [admin, ""]
    - [root, ""]
    - [test, ""]
  login_indicators:
    success_signals:
      - token
      - access_token
      - session
      - 登录成功
  fix: 禁止空密码登录

- name: 常见弱口令检测
  type: weak_password
  severity: medium
  description: 检测常见弱口令组合
  credentials:
    - [admin, 12345678]
    - [admin, 123456789]
    - [admin, 1234567890]
    - [admin, abc123]
    - [admin, qwerty]
    - [admin, letmein]
    - [admin, welcome]
    - [admin, monkey]
    - [admin, dragon]
    - [admin, master]
    - [admin, login]
    - [admin, 111111]
    - [admin, 000000]
    - [admin, password1]
    - [admin, admin1234]
  fix: 强制密码复杂度策略，密码长度不少于8位
