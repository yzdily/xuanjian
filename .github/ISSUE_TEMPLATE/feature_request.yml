name: 功能建议
description: 建议新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到什么不便？为什么现有功能不够？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么解决？尽量具体。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现方式？为什么不选？

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 扫描引擎（core/）
        - label: Web UI（web/）
        - label: SKILL 方法论（skills_my/）
        - label: 部署/运维（Docker/start.py）
        - label: 文档
