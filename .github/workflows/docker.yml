# ============================================================
# XuanJian Docker 镜像自动构建与发布
# 触发条件: 推送 v* 标签 / 推送 main 分支 / 手动触发
# 多架构: linux/amd64 + linux/arm64
# 发布到: Docker Hub (xuanjian/xuanjian)
# ============================================================
name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # 支持手动触发

env:
  REGISTRY: docker.io
  IMAGE_NAME: xuanjian/xuanjian

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2. 设置 QEMU（多架构构建前置）----------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ---------- 3. 设置 Buildx ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 4. 登录 Docker Hub ----------
      # 需在仓库 Settings → Secrets 配置:
      #   DOCKERHUB_USERNAME — Docker Hub 用户名
      #   DOCKERHUB_TOKEN    — Docker Hub Access Token（非密码）
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- 5. 生成镜像标签与版本号 ----------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 标签策略:
          #   推送 v1.2.3 标签 → latest + 1.2 + 1.2.3
          #   推送 main 分支   → main
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # ---------- 6. 构建并推送（多架构）----------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 充分利用 GitHub Actions 缓存加速构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 修复 Playwright arm64 构建兼容性
          build-args: |
            PLAYWRIGHT_ARCH=arm64

      # ---------- 7. 生成构建摘要 ----------
      - name: Summary
        run: |
          echo "### Docker 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "镜像地址: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "拉取命令:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
